{% extends 'panel/base.html' %}
{% block title %}Geçmiş Loglar{% endblock %}
{% block content %}
<div class="page-head"><div><span class="eyebrow">Müdür Alanı</span><h1>Geçmiş Loglar</h1></div>
    <div class="export-buttons">
        <a class="primary-link" href="{% url 'export_shift_csv' %}?{{ request.GET.urlencode }}">CSV İndir</a>
        <a class="primary-link" href="{% url 'export_shift_excel' %}?{{ request.GET.urlencode }}">Excel İndir</a>
        <a class="primary-link" href="{% url 'export_shift_pdf' %}?{{ request.GET.urlencode }}">PDF İndir</a>
    </div>
</div>
<div class="panel-card">
    <form method="get" class="filter-row filter-grid">
        {{ form.as_p }}
        <button type="submit">Ara</button>
    </form>
</div>
<div class="panel-card">
    {% include 'panel/partials_records_table.html' with records=records show_actions=True %}
</div>
{% endblock %}
