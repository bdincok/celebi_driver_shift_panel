{% extends 'panel/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><div><span class="eyebrow">Düzenleme</span><h1>{{ title }}</h1></div></div>
<div class="panel-card narrow">
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="button-row"><button type="submit">Kaydet</button><a class="secondary-link" href="{{ back_url }}">Geri</a></div>
    </form>
</div>
{% endblock %}
