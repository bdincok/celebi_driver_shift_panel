{% if items %}
    <div class="bar-chart">
        {% for item in items %}
            <div class="bar-row">
                <div class="bar-label" title="{{ item.label }}">{{ item.label }}</div>
                <div class="bar-track"><div class="bar-fill" style="width: {{ item.percent }}%;"></div></div>
                <div class="bar-value">{{ item.total }}</div>
            </div>
        {% endfor %}
    </div>
{% else %}
    <p class="empty small-empty">{{ empty_text }}</p>
{% endif %}
